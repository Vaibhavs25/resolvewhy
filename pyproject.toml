[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "resolvewhy"
version = "0.1.0rc1"
description = "Independently verifiable dependency-resolution explanations"
readme = "README.md"
requires-python = ">=3.10,<3.13"

[project.optional-dependencies]
pip-resolvelib = [
    "resolvelib>=1.2,<2",
    "packaging>=24",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
