[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resolvewhy"
version = "0.1.0.dev0"
description = "Independently verifiable dependency-resolution explanations"
requires-python = ">=3.10"

[project.optional-dependencies]
pip-resolvelib = [
    "resolvelib>=1.2,<2",
    "packaging>=24",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
