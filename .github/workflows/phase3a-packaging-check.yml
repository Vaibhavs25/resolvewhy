name: Phase 3A Packaging Check

on:
  push:
    paths:
      - "pyproject.toml"
      - "src/**"
      - ".github/workflows/phase3a-packaging-check.yml"

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - shell: pwsh
        run: |
          python -m pip install -e ".[pip-resolvelib]"
          python -c "import resolvewhy; print(resolvewhy.__file__)"
