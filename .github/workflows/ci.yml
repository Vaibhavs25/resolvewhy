name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and adapter dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[pip-resolvelib]"
      - name: Run production tests
        run: python -m unittest discover -s tests -v
      - name: Run research tests
        run: python -m unittest research.test_reproducibility -v
      - name: Run reproducibility harness
        run: python research/run_reproducibility.py --json

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and adapter dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[pip-resolvelib]"
      - name: Run production tests
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Run research tests
        shell: pwsh
        run: python -m unittest research.test_reproducibility -v
      - name: Run reproducibility harness
        shell: pwsh
        run: python research/run_reproducibility.py --json

  package-artifacts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install packaging tools
        run: python -m pip install --upgrade pip build twine
      - name: Build and validate artifacts
        run: |
          python -m build --outdir dist
          python -m twine check dist/*
      - name: Smoke-test wheel outside the checkout
        run: |
          python -m venv .artifact-wheel
          wheel=$(echo dist/*.whl)
          .artifact-wheel/bin/python -m pip install "${wheel}[pip-resolvelib]"
          expected_version=$(python -c 'import pathlib, re; match = re.search(r"^version\s*=\s*\"([^\"]+)\"", pathlib.Path("pyproject.toml").read_text(), re.M); assert match; print(match.group(1))')
          cd /tmp
          RESOLVEWHY_SMOKE_FIXTURE="$GITHUB_WORKSPACE/tests/fixtures/production_trace.json" \
            RESOLVEWHY_EXPECTED_VERSION="$expected_version" \
            "$GITHUB_WORKSPACE/.artifact-wheel/bin/python" \
            "$GITHUB_WORKSPACE/tests/packaging_smoke.py"
          "$GITHUB_WORKSPACE/.artifact-wheel/bin/python" -m pip check
      - name: Smoke-test source distribution outside the checkout
        run: |
          python -m venv .artifact-sdist
          sdist=$(echo dist/*.tar.gz)
          .artifact-sdist/bin/python -m pip install "${sdist}[pip-resolvelib]"
          expected_version=$(python -c 'import pathlib, re; match = re.search(r"^version\s*=\s*\"([^\"]+)\"", pathlib.Path("pyproject.toml").read_text(), re.M); assert match; print(match.group(1))')
          cd /tmp
          RESOLVEWHY_SMOKE_FIXTURE="$GITHUB_WORKSPACE/tests/fixtures/production_trace.json" \
            RESOLVEWHY_EXPECTED_VERSION="$expected_version" \
            "$GITHUB_WORKSPACE/.artifact-sdist/bin/python" \
            "$GITHUB_WORKSPACE/tests/packaging_smoke.py"
          "$GITHUB_WORKSPACE/.artifact-sdist/bin/python" -m pip check
