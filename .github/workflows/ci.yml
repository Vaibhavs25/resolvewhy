name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned quality tools
        run: python -m pip install --upgrade pip && python -m pip install -r quality-requirements.txt
      - name: Run Ruff
        run: python -m ruff check --no-cache src tests
      - name: Run mypy
        run: python -m mypy --no-incremental --ignore-missing-imports --follow-imports=skip src

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and adapter dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[pip-resolvelib]"
      - name: Run production tests
        run: python -m unittest discover -s tests -v
      - name: Run research tests
        run: python -m unittest research.test_reproducibility -v
      - name: Run reproducibility harness
        run: python research/run_reproducibility.py --json

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and adapter dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[pip-resolvelib]"
      - name: Run production tests
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Run research tests
        shell: pwsh
        run: python -m unittest research.test_reproducibility -v
      - name: Run reproducibility harness
        shell: pwsh
        run: python research/run_reproducibility.py --json

  package-artifacts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install packaging tools
        run: python -m pip install --upgrade pip build twine
      - name: Build and validate artifacts
        run: |
          python -m build --outdir dist
          python -m twine check dist/*
      - name: Smoke-test wheel outside the checkout
        run: |
          python -m venv .artifact-wheel
          wheel=$(echo dist/*.whl)
          .artifact-wheel/bin/python -m pip install "${wheel}[pip-resolvelib]"
          expected_version=$(python -c 'import pathlib, re; match = re.search(r"^version\s*=\s*\"([^\"]+)\"", pathlib.Path("pyproject.toml").read_text(), re.M); assert match; print(match.group(1))')
          cd /tmp
          RESOLVEWHY_SMOKE_FIXTURE="$GITHUB_WORKSPACE/tests/fixtures/production_trace.json" \
            RESOLVEWHY_EXPECTED_VERSION="$expected_version" \
            "$GITHUB_WORKSPACE/.artifact-wheel/bin/python" \
            "$GITHUB_WORKSPACE/tests/packaging_smoke.py"
          "$GITHUB_WORKSPACE/.artifact-wheel/bin/python" -m pip check
      - name: Smoke-test source distribution outside the checkout
        run: |
          python -m venv .artifact-sdist
          sdist=$(echo dist/*.tar.gz)
          .artifact-sdist/bin/python -m pip install "${sdist}[pip-resolvelib]"
          expected_version=$(python -c 'import pathlib, re; match = re.search(r"^version\s*=\s*\"([^\"]+)\"", pathlib.Path("pyproject.toml").read_text(), re.M); assert match; print(match.group(1))')
          cd /tmp
          RESOLVEWHY_SMOKE_FIXTURE="$GITHUB_WORKSPACE/tests/fixtures/production_trace.json" \
            RESOLVEWHY_EXPECTED_VERSION="$expected_version" \
            "$GITHUB_WORKSPACE/.artifact-sdist/bin/python" \
            "$GITHUB_WORKSPACE/tests/packaging_smoke.py"
          "$GITHUB_WORKSPACE/.artifact-sdist/bin/python" -m pip check

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned security tools
        run: python -m pip install --upgrade pip -r security-requirements.txt
      - name: Static security analysis
        run: python -m bandit -r src
      - name: Audit base runtime dependencies
        run: |
          python -m venv .security-runtime
          .security-runtime/bin/python -m pip install --upgrade pip
          .security-runtime/bin/python -m pip install -e .
          .security-runtime/bin/python -m pip list --format=freeze > .security-runtime-freeze.txt
          grep -E -v '^(resolvewhy|pip|setuptools)==' .security-runtime-freeze.txt > .security-runtime-third-party.txt || true
          if [ -s .security-runtime-third-party.txt ]; then
            python -m pip_audit --strict --progress-spinner off -r .security-runtime-third-party.txt
          else
            echo "No third-party base runtime dependencies to audit."
          fi
          .security-runtime/bin/python -m pip check
      - name: Audit optional pip-resolvelib dependencies
        run: |
          python -m venv .security-pip-resolvelib
          .security-pip-resolvelib/bin/python -m pip install --upgrade pip
          .security-pip-resolvelib/bin/python -m pip install -e ".[pip-resolvelib]"
          .security-pip-resolvelib/bin/python -m pip list --format=freeze > .security-pip-resolvelib-freeze.txt
          grep -E -v '^(resolvewhy|pip|setuptools)==' .security-pip-resolvelib-freeze.txt > .security-pip-resolvelib-third-party.txt || true
          python -m pip_audit --strict --progress-spinner off -r .security-pip-resolvelib-third-party.txt
          .security-pip-resolvelib/bin/python -m pip check
