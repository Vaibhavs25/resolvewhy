name: Phase 3A Windows Validation

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/phase3a-windows-validation.yml"

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install editable package
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[pip-resolvelib]"

      - name: Production test suite
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Production verbose suite
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Research reproducibility suite
        shell: pwsh
        run: python -m unittest research.test_reproducibility

      - name: Editable import check
        shell: pwsh
        run: python -c "import resolvewhy; print(resolvewhy.__file__)"
